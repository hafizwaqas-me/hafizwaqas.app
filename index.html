<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: radial-gradient(circle at 15% 20%, #4f46e5 0%, #0b1021 40%),
          radial-gradient(circle at 85% 80%, #06b6d4 0%, #0b1021 45%),
          #020617;
        color: #e2e8f0;
      }

      .card {
        width: min(92vw, 760px);
        padding: clamp(2rem, 4vw, 3.5rem);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.25);
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 70px rgba(2, 6, 23, 0.6);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.45);
        color: #67e8f9;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.2rem 0 0.8rem;
        font-size: clamp(2rem, 6vw, 3.2rem);
        line-height: 1.1;
        color: #f8fafc;
      }

      p {
        margin: 0 auto;
        max-width: 58ch;
        font-size: clamp(1rem, 2.5vw, 1.18rem);
        line-height: 1.65;
        color: #cbd5e1;
      }

      .soon {
        margin-top: 1.6rem;
        font-weight: 700;
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Work in Progress</span>
      <h1>CMP Portfolio Project</h1>
      <p>
        We’re currently crafting a polished portfolio experience. The project is
        still in progress and will be live soon.
      </p>
      <p class="soon">Stay tuned ✨</p>
    </main>
  </body>
</html>
